<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 確保手機全螢幕與支援安全區域，並禁止手動縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>我的遊戲</title>

    <!-- 連結 Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS 專屬 PWA 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        /* 1. 徹底防止 iOS 雙擊放大與文字選取、保留觸控操作 */
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 2. 自動避開 iPhone 頂端瀏海/動態島與底部 Home 條 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* 可依你原本遊戲調整背景色 */
        }

        /* ==========================================
           【請把你的原本遊戲 CSS 樣式貼在這邊】
           ========================================== */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- ==========================================
       【請把你的原本遊戲 HTML 結構貼在這邊】
       ========================================== -->
    <div id="game-container">
        <!-- 你的遊戲畫面、畫布 (canvas) 或按鈕 -->
    </div>

    <!-- JavaScript 遊戲邏輯與觸控防護 -->
    <script>
        /* ==========================================
           【請把你的原本遊戲 JavaScript 邏輯貼在這邊】
           ========================================== */

        // 範例：如果你有按鈕需要防止 iOS 雙擊放大延遲，可以這樣綁定：
        /*
        const leftBtn = document.getElementById('你的左轉按鈕ID');
        leftBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 阻止 iOS 預設的縮放/滾動
            // 你的向左移動程式碼
        }, { passive: false });
        */

        // 註冊 Service Worker（讓網站具備 PWA 離線與安裝能力）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker 註冊成功:', reg.scope))
                    .catch(err => console.log('Service Worker 註冊失敗:', err));
            });
        }
    </script>
</body>
</html>
